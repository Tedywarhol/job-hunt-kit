<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline du Job-Hunt Kit</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Skin : bleu marine et Montserrat du design system des CV (templates/cv/cv.css),
       accent orange du plugin diagram-design (le CV n'a pas de couleur d'accent). */
    :root {
      --color-paper:   #f7f7f5;
      --color-ink:     #323b4c;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Montserrat', 'Segoe UI', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Job-Hunt Kit</p>
    <h1>Du repérage de l’offre au suivi des réponses</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
        <title id="pipeline-title">Pipeline du Job-Hunt Kit</title>
        <desc id="pipeline-desc">Les offres repérées par le radar sont notées et suivies dans Notion, deviennent un CV et une lettre PDF, passent le garde-fou des refus, partent en brouillon Gmail envoyé par le candidat, puis sont relancées jusqu’à réponse, le statut revenant dans Notion.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f7f5"/>

        <!-- Zones (avant les flèches et les blocs) -->
        <rect x="40" y="40" width="208" height="240" rx="8" fill="rgba(50,59,76,0.02)" stroke="rgba(50,59,76,0.10)" stroke-width="0.8"/>
        <rect x="52" y="44" width="64" height="12" rx="2" fill="#f7f7f5"/>
        <text x="84" y="53" fill="rgba(50,59,76,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">01 · RADAR</text>

        <rect x="280" y="40" width="640" height="240" rx="8" fill="rgba(50,59,76,0.02)" stroke="rgba(50,59,76,0.10)" stroke-width="0.8"/>
        <rect x="292" y="44" width="96" height="12" rx="2" fill="#f7f7f5"/>
        <text x="340" y="53" fill="rgba(50,59,76,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">02 · CANDIDATURE</text>

        <rect x="40" y="336" width="880" height="152" rx="8" fill="rgba(50,59,76,0.02)" stroke="rgba(50,59,76,0.10)" stroke-width="0.8"/>
        <rect x="52" y="340" width="64" height="12" rx="2" fill="#f7f7f5"/>
        <text x="84" y="349" fill="rgba(50,59,76,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">03 · SUIVI</text>

        <!-- Flèches (derrière les blocs) -->
        <line x1="144" y1="144" x2="144" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="144" y1="256" x2="144" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 228,408 H 368 Q 376,408 376,400 V 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="376" y1="144" x2="376" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="456" y1="224" x2="520" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="224" x2="744" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="824" y1="256" x2="824" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="600" y1="376" x2="600" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 824,440 V 460 Q 824,468 816,468 H 152 Q 144,468 144,460 V 440" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Étiquettes de flèches (masque opaque, 8 px de la ligne) -->
        <rect x="152" y="310" width="80" height="12" rx="2" fill="#f7f7f5"/>
        <text x="192" y="319" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OFFRES NOTÉES</text>

        <rect x="268" y="388" width="60" height="12" rx="2" fill="#f7f7f5"/>
        <text x="298" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">À TRAITER</text>

        <rect x="748" y="310" width="68" height="12" rx="2" fill="#f7f7f5"/>
        <text x="782" y="319" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APRÈS ENVOI</text>

        <rect x="608" y="310" width="48" height="12" rx="2" fill="#f7f7f5"/>
        <text x="632" y="319" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADRESSE</text>

        <rect x="354" y="448" width="44" height="12" rx="2" fill="#f7f7f5"/>
        <text x="376" y="457" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATUT</text>

        <!-- Bloc : Sources d'offres (externe) -->
        <rect x="60" y="80" width="168" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="60" y="80" width="168" height="64" rx="6" fill="rgba(50,59,76,0.03)" stroke="rgba(50,59,76,0.30)" stroke-width="1"/>
        <rect x="68" y="86" width="28" height="12" rx="2" fill="transparent" stroke="rgba(50,59,76,0.22)" stroke-width="0.8"/>
        <text x="82" y="95" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="144" y="116" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Sources d’offres</text>
        <text x="144" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ATS · PASS · LinkedIn</text>

        <!-- Bloc : Radar (traitement) -->
        <rect x="60" y="192" width="168" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="60" y="192" width="168" height="64" rx="6" fill="#ffffff" stroke="#323b4c" stroke-width="1"/>
        <rect x="68" y="198" width="32" height="12" rx="2" fill="transparent" stroke="rgba(50,59,76,0.40)" stroke-width="0.8"/>
        <text x="84" y="207" fill="#323b4c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCAN</text>
        <text x="144" y="228" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Radar</text>
        <text x="144" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dédup · score /100</text>

        <!-- Bloc : Profil maître (données) -->
        <rect x="296" y="80" width="160" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="296" y="80" width="160" height="64" rx="6" fill="rgba(50,59,76,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="304" y="86" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="320" y="95" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
        <text x="376" y="116" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Profil maître</text>
        <text x="376" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cv-data.json</text>

        <!-- Bloc : CV + lettre PDF (focal) -->
        <rect x="296" y="192" width="160" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="296" y="192" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="304" y="198" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="318" y="207" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PDF</text>
        <text x="376" y="228" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">CV + lettre PDF</text>
        <text x="376" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 page · mots-clés ATS</text>

        <!-- Bloc : Garde-fou des refus (sécurité) -->
        <rect x="520" y="192" width="160" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="520" y="192" width="160" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="528" y="198" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
        <text x="546" y="207" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text>
        <text x="600" y="228" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Garde-fou refus</text>
        <text x="600" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">avant chaque envoi</text>

        <!-- Bloc : Brouillon Gmail (action du candidat) -->
        <rect x="744" y="192" width="160" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="744" y="192" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="752" y="198" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="768" y="207" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAIL</text>
        <text x="824" y="228" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Brouillon Gmail</text>
        <text x="824" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vous l’envoyez</text>

        <!-- Bloc : Suivi Notion (données) -->
        <rect x="60" y="376" width="168" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="60" y="376" width="168" height="64" rx="6" fill="rgba(50,59,76,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="68" y="382" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="84" y="391" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASE</text>
        <text x="144" y="412" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Suivi Notion</text>
        <text x="144" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">offres · statuts</text>

        <!-- Bloc : Réseau de contacts (données) -->
        <rect x="520" y="376" width="160" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="520" y="376" width="160" height="64" rx="6" fill="rgba(50,59,76,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="528" y="382" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="544" y="391" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="600" y="412" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Réseau de contacts</text>
        <text x="600" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">confiance 1 à 5</text>

        <!-- Bloc : Relances (traitement) -->
        <rect x="744" y="376" width="160" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="744" y="376" width="160" height="64" rx="6" fill="#ffffff" stroke="#323b4c" stroke-width="1"/>
        <rect x="752" y="382" width="28" height="12" rx="2" fill="transparent" stroke="rgba(50,59,76,0.40)" stroke-width="0.8"/>
        <text x="766" y="391" fill="#323b4c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">J+N</text>
        <text x="824" y="412" fill="#323b4c" font-size="12" font-weight="600" font-family="'Montserrat', sans-serif" text-anchor="middle">Relances</text>
        <text x="824" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">J+3 à J+10</text>

        <!-- Annotation (marge haute de la zone Candidature) -->
        <text x="904" y="116" fill="#323b4c" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Rien ne part sans vous : le kit prépare, vous envoyez.</text>
        <path d="M 864,124 Q 864,164 840,192" fill="none" stroke="rgba(50,59,76,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="840" cy="192" r="2" fill="#323b4c"/>

        <!-- Légende -->
        <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(50,59,76,0.10)" stroke-width="0.8"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LÉGENDE</text>

        <rect x="40" y="548" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Livrable central</text>

        <rect x="172" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#323b4c" stroke-width="1"/>
        <text x="192" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Traitement</text>

        <rect x="268" y="548" width="14" height="10" rx="2" fill="rgba(50,59,76,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="288" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Données</text>

        <rect x="348" y="548" width="14" height="10" rx="2" fill="rgba(50,59,76,0.03)" stroke="rgba(50,59,76,0.30)" stroke-width="1"/>
        <text x="368" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Source externe</text>

        <rect x="468" y="548" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="488" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Votre action</text>

        <rect x="576" y="548" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="596" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Garde-fou</text>

        <line x1="668" y1="553" x2="696" y2="553" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="704" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Flux</text>

        <line x1="748" y1="553" x2="776" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="784" y="556" fill="#4f5d75" font-size="8.5" font-family="'Montserrat', sans-serif">Mise à jour du statut</text>
      </svg>
    </div>
  </div>
</body>
</html>
